services:
  - type: web
    name: futpass-escolinha01
    runtime: node
    plan: free
    branch: main
    rootDir: FutPass_App
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_SECURE_COOKIES
        value: "true"
      - key: CORS_ALLOWED_ORIGIN
        value: ""
      - key: MONGO_URI
        sync: false
